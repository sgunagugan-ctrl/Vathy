<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Assistant</title>
<style>
  :root { --bg:#eaf2ff; --panel:#fff; --text:#12233f; --muted:#5b6f8f; --accent:#1e63e9; --me:#1e63e9; --bot:#dbe8ff; --line:#c3d6f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1730; --panel:#10213f; --text:#e6efff; --muted:#8fa6cc; --accent:#3b7bff; --me:#3b7bff; --bot:#17305c; --line:#24437a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header input, header select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; min-width: 0; }
  header input { flex: 1; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--me); color: #fff; }
  .bot { align-self: flex-start; background: var(--bot); }
  .hint { margin: auto; color: var(--muted); text-align: center; padding: 0 20px; }
  footer { padding: 14px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #status { color: var(--muted); min-height: 1.5em; text-align: center; }
  #mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 34px; cursor: pointer; }
  #mic.listening { background: #d93a3a; animation: pulse 1.2s infinite; }
  #mic.busy { opacity: .6; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(217,58,58,.5); } 100% { box-shadow: 0 0 0 22px rgba(217,58,58,0); } }
  @media (prefers-reduced-motion: reduce) { #mic.listening { animation: none; } }
  #stop { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <input id="key" type="password" placeholder="Paste your Groq API key" autocomplete="off">
  <select id="lang" aria-label="Language">
    <option value="en-US">English</option>
    <option value="ta-IN">Tamil</option>
    <option value="hi-IN">Hindi</option>
    <option value="te-IN">Telugu</option>
    <option value="ml-IN">Malayalam</option>
  </select>
</header>
<div id="log"><div class="hint">Tap the mic and speak. The assistant will answer out loud.</div></div>
<footer>
  <div id="status">Ready</div>
  <button id="mic" aria-label="Start talking">🎤</button>
  <button id="stop" type="button">Stop speaking</button>
</footer>

<script>
const MODEL = "openai/gpt-oss-120b";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const $ = id => document.getElementById(id);
const log = $("log"), statusEl = $("status"), mic = $("mic"), keyInput = $("key"), langSel = $("lang");
let history = [{ role: "system", content: "You are a friendly voice assistant. Reply in the same language the user speaks. Keep answers short and natural for speaking: no markdown, no lists, no emojis." }];
let recognition = null, busy = false;

try { keyInput.value = localStorage.getItem("groq_key") || ""; } catch (e) {}
keyInput.addEventListener("change", () => { try { localStorage.setItem("groq_key", keyInput.value.trim()); } catch (e) {} });

function add(role, text) {
  log.querySelector(".hint")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function setStatus(t) { statusEl.textContent = t; }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) setStatus("Speech recognition is not supported here. Use Chrome on Android.");

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langSel.value;
  u.onstart = () => setStatus("Speaking...");
  u.onend = () => setStatus("Ready");
  speechSynthesis.speak(u);
}

async function ask(text) {
  const apiKey = keyInput.value.trim();
  if (!apiKey) { setStatus("Paste your Groq API key first."); return; }
  history.push({ role: "user", content: text });
  add("user", text);
  busy = true; mic.classList.add("busy"); setStatus("Thinking...");
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + apiKey },
      body: JSON.stringify({ model: MODEL, messages: history })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || res.statusText);
    const reply = data.choices[0].message.content.trim();
    history.push({ role: "assistant", content: reply });
    add("bot", reply);
    speak(reply);
  } catch (err) {
    history.pop();
    add("bot", "Error: " + err.message);
    setStatus("Ready");
  } finally {
    busy = false; mic.classList.remove("busy");
  }
}

function listen() {
  if (!SR || busy) return;
  speechSynthesis.cancel();
  recognition = new SR();
  recognition.lang = langSel.value;
  recognition.interimResults = false;
  recognition.onstart = () => { mic.classList.add("listening"); setStatus("Listening..."); };
  recognition.onresult = e => ask(e.results[0][0].transcript);
  recognition.onerror = e => setStatus(e.error === "not-allowed" ? "Allow microphone access, then try again." : "Could not hear you (" + e.error + ").");
  recognition.onend = () => mic.classList.remove("listening");
  recognition.start();
}

mic.addEventListener("click", () => {
  if (mic.classList.contains("listening")) recognition.stop(); else listen();
});
$("stop").addEventListener("click", () => { speechSynthesis.cancel(); setStatus("Ready"); });
</script>
</body>
</html>
