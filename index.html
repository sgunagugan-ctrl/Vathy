<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vathy</title>
<style>
  :root { --bg:#eaf2ff; --panel:#fff; --text:#12233f; --muted:#5b6f8f; --accent:#1e63e9; --me:#1e63e9; --bot:#dbe8ff; --line:#c3d6f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1730; --panel:#10213f; --text:#e6efff; --muted:#8fa6cc; --accent:#3b7bff; --me:#3b7bff; --bot:#17305c; --line:#24437a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  input, select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; min-width: 0; }
  header input { flex: 1; }
  #stage { display: flex; flex-direction: column; align-items: center; padding: 8px 14px 4px; gap: 6px; }
  #doll { width: 170px; height: 170px; cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: 0; padding: 0; }
  #doll svg { width: 100%; height: 100%; overflow: visible; }
  #doll.asleep svg { animation: breathe 3.5s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { #doll.asleep svg { animation: none; } }
  .eyes-open, .mouth-open, .zzz { display: none; }
  #doll:not(.asleep) .eyes-open { display: inline; }
  #doll:not(.asleep) .eyes-closed, #doll:not(.asleep) .zzz { display: none; }
  #doll.asleep .zzz { display: inline; }
  #doll.talking .mouth-open { display: inline; }
  #doll.talking .mouth-smile { display: none; }
  #codeRow { display: flex; gap: 6px; width: 100%; max-width: 320px; }
  #codeRow input { flex: 1; text-align: center; }
  #codeRow button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--me); color: #fff; }
  .bot { align-self: flex-start; background: var(--bot); }
  .hint { margin: auto; color: var(--muted); text-align: center; padding: 0 20px; }
  footer { padding: 12px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #status { color: var(--muted); min-height: 1.5em; text-align: center; }
  #mic { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 30px; cursor: pointer; }
  #mic.listening { background: #d93a3a; animation: pulse 1.2s infinite; }
  #mic.busy { opacity: .6; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(217,58,58,.5); } 100% { box-shadow: 0 0 0 22px rgba(217,58,58,0); } }
  @media (prefers-reduced-motion: reduce) { #mic.listening { animation: none; } }
  #stop { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <input id="key" type="password" placeholder="Paste your Groq API key" autocomplete="off">
  <select id="lang" aria-label="Language">
    <option value="en-US">English</option>
    <option value="ta-IN">Tamil</option>
    <option value="hi-IN">Hindi</option>
    <option value="te-IN">Telugu</option>
    <option value="ml-IN">Malayalam</option>
  </select>
</header>

<div id="stage">
  <button id="doll" class="asleep" aria-label="Tap the doll">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <radialGradient id="face" cx="50%" cy="62%" r="62%">
          <stop offset="0" stop-color="#cfe6ff"/><stop offset=".45" stop-color="#5b9aff"/><stop offset="1" stop-color="#1e63e9"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="114" r="84" fill="#4a8cf5" opacity=".22"/>
      <circle cx="100" cy="114" r="70" fill="url(#face)"/>
      <g id="wool"></g>
      <g class="eyes-closed" fill="#0b1730">
        <rect x="68" y="112" width="26" height="9" rx="4.5"/><rect x="106" y="112" width="26" height="9" rx="4.5"/>
      </g>
      <g class="eyes-open">
        <circle cx="82" cy="116" r="12" fill="#fff"/><circle cx="118" cy="116" r="12" fill="#fff"/>
        <circle cx="84" cy="117" r="7" fill="#0b1730"/><circle cx="120" cy="117" r="7" fill="#0b1730"/>
        <circle cx="86" cy="114" r="2.5" fill="#fff"/><circle cx="122" cy="114" r="2.5" fill="#fff"/>
      </g>
      <ellipse class="mouth-open" cx="100" cy="146" rx="9" ry="7" fill="#0b1730"/>
      <g class="zzz" fill="#5b6f8f" font-family="system-ui" font-weight="700">
        <text x="158" y="40" font-size="20">z</text><text x="172" y="24" font-size="15">z</text>
      </g>
    </svg>
  </button>
  <div id="codeRow">
    <input id="code" placeholder="Activation code" autocomplete="off" autocapitalize="none">
    <button id="wake" type="button">Wake</button>
  </div>
</div>

<div id="log"><div class="hint">Tap the doll to hear who made it. Then say or type the activation code to wake it.</div></div>
<footer>
  <div id="status">Asleep</div>
  <button id="mic" aria-label="Talk">🎤</button>
  <button id="stop" type="button">Stop speaking</button>
</footer>

<script>
const MODEL = "openai/gpt-oss-120b";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";
const ACTIVATION_CODE = "vathy";
const CREDIT = "This is created by S.Gugan";

const $ = id => document.getElementById(id);
const log = $("log"), statusEl = $("status"), mic = $("mic"), keyInput = $("key"), langSel = $("lang"), doll = $("doll");
let history = [{ role: "system", content: "You are Vathy, a friendly voice assistant. Reply in the same language the user speaks. Keep answers short and natural for speaking: no markdown, no lists, no emojis." }];
let recognition = null, busy = false, asleep = true;

// Build the woolly blue hair from fluffy circles
(function buildWool() {
  const g = $("wool"), shades = ["#2a5fc8", "#3d7df0", "#5b9aff", "#1e4fb0", "#4a8cf5"];
  const add = (cx, cy, r, i) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", cx.toFixed(1)); c.setAttribute("cy", cy.toFixed(1)); c.setAttribute("r", r);
    c.setAttribute("fill", shades[i % shades.length]);
    g.appendChild(c);
  };
  const ring = (n, from, span, rad, r, off) => {
    for (let i = 0; i <= n; i++) {
      const a = Math.PI + from * Math.PI + (i / n) * span * Math.PI;
      add(100 + Math.cos(a) * rad, 114 + Math.sin(a) * rad, r + (i % 3) * 2, i + off);
    }
  };
  ring(6, 0.18, 0.64, 76, 12, 1);     // puffy tufts on top
  ring(13, 0, 1, 62, 17, 0);          // main woolly arc
  ring(9, 0.15, 0.7, 46, 15, 2);      // fringe over the forehead
})();

try { keyInput.value = localStorage.getItem("groq_key") || ""; } catch (e) {}
keyInput.addEventListener("change", () => { try { localStorage.setItem("groq_key", keyInput.value.trim()); } catch (e) {} });

function add(role, text) {
  log.querySelector(".hint")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function setStatus(t) { statusEl.textContent = t; }

function speak(text, lang) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || langSel.value;
  u.onstart = () => { doll.classList.add("talking"); setStatus("Speaking..."); };
  u.onend = u.onerror = () => { doll.classList.remove("talking"); setStatus(asleep ? "Asleep" : "Ready"); };
  speechSynthesis.speak(u);
}

const norm = s => s.toLowerCase().replace(/[^a-z]/g, "");
function codeMatches(s) { const n = norm(s); return n === ACTIVATION_CODE || n === "vathi"; }

function checkCode(s) {
  if (codeMatches(s)) {
    asleep = false;
    doll.classList.remove("asleep");
    $("codeRow").style.display = "none";
    $("code").value = "";
    log.querySelector(".hint")?.remove();
    add("bot", "I'm awake! Tap the mic and talk to me.");
    speak("Hello, I am awake. How can I help you?", "en-US");
  } else {
    setStatus("Wrong code. Try again.");
    speak("Wrong code.", "en-US");
  }
}

doll.addEventListener("click", () => speak(CREDIT, "en-US"));
$("wake").addEventListener("click", () => checkCode($("code").value));
$("code").addEventListener("keydown", e => { if (e.key === "Enter") checkCode($("code").value); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) setStatus("Speech recognition is not supported here. Use Chrome on Android.");

async function ask(text) {
  const apiKey = keyInput.value.trim();
  if (!apiKey) { setStatus("Paste your Groq API key first."); return; }
  history.push({ role: "user", content: text });
  add("user", text);
  busy = true; mic.classList.add("busy"); setStatus("Thinking...");
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + apiKey },
      body: JSON.stringify({ model: MODEL, messages: history })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || res.statusText);
    const reply = data.choices[0].message.content.trim();
    history.push({ role: "assistant", content: reply });
    add("bot", reply);
    speak(reply);
  } catch (err) {
    history.pop();
    add("bot", "Error: " + err.message);
    setStatus("Ready");
  } finally {
    busy = false; mic.classList.remove("busy");
  }
}

function listen() {
  if (!SR || busy) return;
  speechSynthesis.cancel();
  recognition = new SR();
  recognition.lang = asleep ? "en-US" : langSel.value;
  recognition.interimResults = false;
  recognition.onstart = () => { mic.classList.add("listening"); setStatus(asleep ? "Say the activation code..." : "Listening..."); };
  recognition.onresult = e => { const t = e.results[0][0].transcript; asleep ? checkCode(t) : ask(t); };
  recognition.onerror = e => setStatus(e.error === "not-allowed" ? "Allow microphone access, then try again." : "Could not hear you (" + e.error + ").");
  recognition.onend = () => mic.classList.remove("listening");
  recognition.start();
}

mic.addEventListener("click", () => {
  if (mic.classList.contains("listening")) recognition.stop(); else listen();
});
$("stop").addEventListener("click", () => { speechSynthesis.cancel(); doll.classList.remove("talking"); setStatus(asleep ? "Asleep" : "Ready"); });
</script>
</body>
  </html>
